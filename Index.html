<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇小游戏</title>
<style>
/* SECTION: base */
:root{
  --bg:#0b1120;
  --panel:#121c33;
  --line:#22304f;
  --text:#e7eef9;
  --muted:#8fa2c2;
  --green:#34d399;
  --green-deep:#059669;
  --red:#fb7185;
  --amber:#fbbf24;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(1100px 700px at 50% -10%, #182742 0%, var(--bg) 60%) fixed;
  color:var(--text);
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;
  padding:18px 14px calc(20px + env(safe-area-inset-bottom));
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}

/* SECTION: hud */
.hud{
  width:min(560px,100%);
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:14px;
}
.brand{
  font-size:22px;font-weight:700;letter-spacing:1px;
  display:flex;align-items:center;gap:8px;
}
.brand .dot{color:var(--green)}
.scores{display:flex;gap:10px}
.score-box{
  background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:7px 14px;min-width:86px;text-align:center;
}
.score-box .label{display:block;font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:2px}
.score-box .num{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green)}
.score-box.best .num{color:var(--amber)}
.score-box.pop{animation:pop .28s ease}
@keyframes pop{40%{transform:scale(1.12)}}

/* SECTION: board */
.stage{width:min(560px,100%);display:flex;flex-direction:column;align-items:center}
.board-wrap{
  position:relative;width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px;
  box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 0 40px rgba(52,211,153,.04);
}
#game{display:block;margin:0 auto;border-radius:10px;background:#0d1526}

/* SECTION: overlay */
.overlay{
  position:absolute;inset:10px;border-radius:10px;
  background:rgba(8,13,26,.78);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;
  z-index:5;
}
.overlay[hidden]{display:none}
.overlay-card{text-align:center;padding:20px 26px;max-width:88%}
.overlay-card h2{font-size:28px;margin-bottom:10px;letter-spacing:2px}
.overlay-card p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:18px}
.overlay-card .final{color:var(--text);font-size:15px}
.overlay-card .final b{color:var(--green);font-size:20px}
.overlay-card .record{color:var(--amber);font-weight:700}
.btn-primary{
  background:linear-gradient(135deg,var(--green),var(--green-deep));
  color:#05261b;border:none;border-radius:999px;
  font-size:16px;font-weight:700;letter-spacing:2px;
  padding:12px 38px;cursor:pointer;
  box-shadow:0 8px 22px rgba(52,211,153,.35);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:active{transform:scale(.96)}
.ov-sub{margin-top:14px;font-size:12px;color:var(--muted)}

/* SECTION: toolbar */
.toolbar{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-top:12px;
}
.btn-ghost{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:9px 22px;font-size:14px;cursor:pointer;
  transition:border-color .12s ease, background .12s ease;
}
.btn-ghost:hover{border-color:var(--green)}
.hint{font-size:12px;color:var(--muted);letter-spacing:1px}

/* SECTION: dpad */
.dpad{
  display:none;
  grid-template-columns:repeat(3,66px);
  grid-template-rows:repeat(3,66px);
  gap:8px;margin-top:18px;
  grid-template-areas:". up ." "left mid right" ". down .";
}
.dpad-btn{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:14px;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .1s ease, transform .1s ease;
}
.dpad-btn:active{background:var(--green-deep);transform:scale(.94)}
.dpad-btn.up{grid-area:up}
.dpad-btn.down{grid-area:down}
.dpad-btn.left{grid-area:left}
.dpad-btn.right{grid-area:right}
.dpad-mid{grid-area:mid;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px}
@media (pointer:coarse), (max-width:640px){
  .dpad{display:grid}
  .hint{display:none}
}
noscript{margin-top:20px;color:var(--muted)}
</style>
</head>
<body>

<!-- SECTION: header -->
<header class="hud">
  <div class="brand"><span class="dot">🐍</span>贪吃蛇</div>
  <div class="scores">
    <div class="score-box" id="scoreBox"><span class="label">得分</span><span class="num" id="score">0</span></div>
    <div class="score-box best" id="bestBox"><span class="label">最高纪录</span><span class="num" id="best">0</span></div>
  </div>
</header>

<!-- SECTION: board -->
<main class="stage">
  <div class="board-wrap" id="boardWrap">
    <canvas id="game" width="504" height="504"></canvas>

    <!-- SECTION: overlay -->
    <div class="overlay" id="overlay">
      <div class="overlay-card">
        <h2 id="ovTitle">贪吃蛇</h2>
        <p id="ovDesc">控制小蛇吃掉食物，身体会越来越长。<br>别撞墙，也别咬到自己！</p>
        <button class="btn-primary" id="ovBtn" data-primary-action>开始游戏</button>
        <p class="ov-sub" id="ovSub"></p>
      </div>
    </div>
  </div>

  <!-- SECTION: toolbar -->
  <div class="toolbar">
    <button class="btn-ghost" id="pauseBtn">暂停</button>
    <span class="hint" id="hint">方向键 / WASD 控制 · 空格暂停</span>
  </div>

  <!-- SECTION: dpad -->
  <div class="dpad" id="dpad">
    <button class="dpad-btn up" data-dir="0,-1" aria-label="向上">▲</button>
    <button class="dpad-btn left" data-dir="-1,0" aria-label="向左">◀</button>
    <div class="dpad-mid">✦</div>
    <button class="dpad-btn right" data-dir="1,0" aria-label="向右">▶</button>
    <button class="dpad-btn down" data-dir="0,1" aria-label="向下">▼</button>
  </div>
</main>

<noscript>本游戏需要启用 JavaScript 才能运行。</noscript>

<script>
(function(){
'use strict';

/* SECTION: constants */
var GRID = 21;                 /* 21 x 21 网格 */
var BASE_STEP = 165;           /* 初始每步毫秒数 */
var MIN_STEP = 72;             /* 最快速度 */
var SPEEDUP = 4;               /* 每个食物加快毫秒数 */
var BEST_KEY = 'snake_best_v1';

/* SECTION: dom */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var boardWrap = document.getElementById('boardWrap');
var overlay = document.getElementById('overlay');
var ovTitle = document.getElementById('ovTitle');
var ovDesc = document.getElementById('ovDesc');
var ovBtn = document.getElementById('ovBtn');
var ovSub = document.getElementById('ovSub');
var pauseBtn = document.getElementById('pauseBtn');
var scoreEl = document.getElementById('score');
var bestEl = document.getElementById('best');
var scoreBox = document.getElementById('scoreBox');

/* SECTION: state */
var snake = [];
var dir = {x:1, y:0};
var pendingDirs = [];
var food = {x:15, y:10};
var score = 0;
var best = loadBest();
var state = 'idle';            /* idle | playing | paused | over */
var stepMs = BASE_STEP;
var acc = 0;
var lastTime = 0;
var isNewRecord = false;

bestEl.textContent = best;

function loadBest(){
  try{
    var v = parseInt(localStorage.getItem(BEST_KEY), 10);
    return isNaN(v) ? 0 : v;
  }catch(e){ return 0; }
}
function saveBest(v){
  try{ localStorage.setItem(BEST_KEY, String(v)); }catch(e){}
}

/* SECTION: world */
function resetWorld(){
  var cy = Math.floor(GRID/2);
  snake = [
    {x:10, y:cy}, {x:9, y:cy}, {x:8, y:cy}, {x:7, y:cy}
  ];
  dir = {x:1, y:0};
  pendingDirs = [];
  score = 0;
  stepMs = BASE_STEP;
  isNewRecord = false;
  scoreEl.textContent = '0';
  spawnFood();
}

function spawnFood(){
  var occupied = {};
  for(var i=0;i<snake.length;i++) occupied[snake[i].x+','+snake[i].y] = true;
  var empty = [];
  for(var y=0;y<GRID;y++){
    for(var x=0;x<GRID;x++){
      if(!occupied[x+','+y]) empty.push({x:x, y:y});
    }
  }
  if(empty.length === 0){ food = null; return false; }
  food = empty[Math.floor(Math.random()*empty.length)];
  return true;
}

/* SECTION: flow */
function startGame(){
  resetWorld();
  state = 'playing';
  overlay.hidden = true;
  pauseBtn.textContent = '暂停';
}

function togglePause(){
  if(state === 'playing'){
    state = 'paused';
    pauseBtn.textContent = '继续';
    showOverlay('已暂停', '休息一下，随时继续。', '继续游戏', '');
  }else if(state === 'paused'){
    state = 'playing';
    overlay.hidden = true;
    pauseBtn.textContent = '暂停';
    lastTime = 0; acc = 0;
  }else{
    startGame();
  }
}

function gameOver(win){
  state = 'over';
  pauseBtn.textContent = '重新开始';
  if(score > best){
    best = score;
    saveBest(best);
    bestEl.textContent = best;
    isNewRecord = true;
  }
  if(win){
    showOverlay('🎉 通关了！', '你填满了整个棋盘，太强了！<br><span class="final">本局得分 <b>'+score+'</b></span>' + (isNewRecord ? '<br><span class="record">🏆 新纪录！</span>' : ''), '再来一局', '');
  }else{
    showOverlay('游戏结束', '<span class="final">本局得分 <b>'+score+'</b></span>' + (isNewRecord ? '<br><span class="record">🏆 新纪录！</span>' : '<br>最高纪录 '+best), '再来一局', '按空格或回车快速重开');
  }
}

function showOverlay(title, descHtml, btnText, subText){
  ovTitle.textContent = title;
  ovDesc.innerHTML = descHtml;
  ovBtn.textContent = btnText;
  ovSub.textContent = subText || '';
  overlay.hidden = false;
}

/* SECTION: step */
function queueDir(nd){
  if(pendingDirs.length < 3) pendingDirs.push(nd);
}

function step(){
  while(pendingDirs.length){
    var nd = pendingDirs.shift();
    if(nd.x === -dir.x && nd.y === -dir.y) continue;   /* 禁止 180° 掉头 */
    if(nd.x === dir.x && nd.y === dir.y) continue;
    dir = nd;
    break;
  }
  var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  /* 撞墙 */
  if(head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID){
    gameOver(false);
    return;
  }

  var willGrow = food && head.x === food.x && head.y === food.y;
  var checkLen = willGrow ? snake.length : snake.length - 1;  /* 尾巴会让位 */
  for(var i=0;i<checkLen;i++){
    if(snake[i].x === head.x && snake[i].y === head.y){
      gameOver(false);
      return;
    }
  }

  snake.unshift(head);
  if(willGrow){
    score += 10;
    scoreEl.textContent = score;
    popScore();
    stepMs = Math.max(MIN_STEP, BASE_STEP - (score/10)*SPEEDUP);
    if(!spawnFood()){
      gameOver(true);
      return;
    }
  }else{
    snake.pop();
  }
}

function popScore(){
  scoreBox.classList.remove('pop');
  void scoreBox.offsetWidth;
  scoreBox.classList.add('pop');
}

/* SECTION: loop */
function loop(t){
  requestAnimationFrame(loop);
  if(state === 'playing'){
    if(lastTime === 0) lastTime = t;
    var dt = t - lastTime;
    lastTime = t;
    if(dt > 200) dt = 200;      /* 切后台回来不瞬移 */
    acc += dt;
    while(acc >= stepMs && state === 'playing'){
      step();
      acc -= stepMs;
    }
  }else{
    lastTime = 0;
    acc = 0;
  }
  draw();
}

/* SECTION: render */
function setupCanvas(){
  var dpr = window.devicePixelRatio || 1;
  var cssSize = Math.min(boardWrap.clientWidth - 20, 520);
  if(cssSize < 200) cssSize = 200;
  canvas.style.width = cssSize + 'px';
  canvas.style.height = cssSize + 'px';
  canvas.width = Math.round(cssSize * dpr);
  canvas.height = Math.round(cssSize * dpr);
}

function roundRectPath(px, py, pw, ph, r){
  ctx.beginPath();
  ctx.moveTo(px+r, py);
  ctx.lineTo(px+pw-r, py);
  ctx.arcTo(px+pw, py, px+pw, py+r, r);
  ctx.lineTo(px+pw, py+ph-r);
  ctx.arcTo(px+pw, py+ph, px+pw-r, py+ph, r);
  ctx.lineTo(px+r, py+ph);
  ctx.arcTo(px, py+ph, px, py+ph-r, r);
  ctx.lineTo(px, py+r);
  ctx.arcTo(px, py, px+r, py, r);
  ctx.closePath();
}

function draw(){
  var w = canvas.width;
  var s = w / GRID;
  ctx.clearRect(0, 0, w, w);

  /* 棋盘格 */
  ctx.fillStyle = 'rgba(255,255,255,0.022)';
  for(var y=0;y<GRID;y++){
    for(var x=0;x<GRID;x++){
      if((x+y)%2 === 0) ctx.fillRect(x*s, y*s, s, s);
    }
  }

  /* 食物 */
  if(food){
    var fx = food.x*s + s/2, fy = food.y*s + s/2;
    var grad = ctx.createRadialGradient(fx - s*0.1, fy - s*0.12, s*0.05, fx, fy, s*0.36);
    grad.addColorStop(0, '#fda4af');
    grad.addColorStop(1, '#e11d48');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(fx, fy, s*0.33, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.arc(fx - s*0.1, fy - s*0.12, s*0.06, 0, Math.PI*2);
    ctx.fill();
  }

  /* 蛇（从尾到头，头在最上层） */
  var pad = s * 0.08;
  var len = snake.length;
  for(var i=len-1;i>=0;i--){
    var seg = snake[i];
    var light = 58 - (i/Math.max(len-1,1))*22;
    ctx.fillStyle = 'hsl(152, 68%, ' + light + '%)';
    var r = (i === 0) ? s*0.30 : s*0.22;
    roundRectPath(seg.x*s + pad, seg.y*s + pad, s - pad*2, s - pad*2, r);
    ctx.fill();
  }

  /* 蛇眼睛 */
  if(snake.length){
    var h = snake[0];
    var cx = h.x*s + s/2, cy = h.y*s + s/2;
    var fwdX = dir.x * s*0.16, fwdY = dir.y * s*0.16;
    var sideX = -dir.y * s*0.15, sideY = dir.x * s*0.15;
    ctx.fillStyle = '#08111f';
    ctx.beginPath();
    ctx.arc(cx + fwdX + sideX, cy + fwdY + sideY, s*0.065, 0, Math.PI*2);
    ctx.arc(cx + fwdX - sideX, cy + fwdY - sideY, s*0.065, 0, Math.PI*2);
    ctx.fill();
  }
}

/* SECTION: input-keyboard */
var KEY_DIRS = {
  ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
  w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
  W:[0,-1], S:[0,1], A:[-1,0], D:[1,0]
};

window.addEventListener('keydown', function(e){
  var d = KEY_DIRS[e.key];
  if(d){
    e.preventDefault();
    if(state === 'playing'){
      queueDir({x:d[0], y:d[1]});
    }else if(state === 'idle' || state === 'over'){
      startGame();
      queueDir({x:d[0], y:d[1]});
    }
    return;
  }
  if(e.key === ' '){
    e.preventDefault();
    togglePause();
  }else if(e.key === 'Enter'){
    if(state !== 'playing'){ e.preventDefault(); startGame(); }
  }
});

/* SECTION: input-touch */
var touchStart = null;
boardWrap.addEventListener('touchstart', function(e){
  if(e.touches.length === 1){
    touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
  }
}, {passive:true});

boardWrap.addEventListener('touchmove', function(e){
  if(!touchStart) return;
  var dx = e.touches[0].clientX - touchStart.x;
  var dy = e.touches[0].clientY - touchStart.y;
  if(Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  var nd;
  if(Math.abs(dx) > Math.abs(dy)){
    nd = {x: dx > 0 ? 1 : -1, y: 0};
  }else{
    nd = {x: 0, y: dy > 0 ? 1 : -1};
  }
  if(state === 'playing'){
    queueDir(nd);
    e.preventDefault();
  }
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive:false});

boardWrap.addEventListener('touchend', function(){ touchStart = null; }, {passive:true});

/* SECTION: input-dpad */
var dpadBtns = document.querySelectorAll('.dpad-btn');
for(var i=0;i<dpadBtns.length;i++){
  (function(btn){
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault();
      var parts = btn.getAttribute('data-dir').split(',');
      var nd = {x: parseInt(parts[0],10), y: parseInt(parts[1],10)};
      if(state === 'playing'){
        queueDir(nd);
      }else if(state === 'idle' || state === 'over'){
        startGame();
        queueDir(nd);
      }
    });
  })(dpadBtns[i]);
}

/* SECTION: input-buttons */
ovBtn.addEventListener('click', function(){
  if(state === 'paused'){ togglePause(); }else{ startGame(); }
});
pauseBtn.addEventListener('click', function(){
  if(state === 'over'){ startGame(); }else{ togglePause(); }
});
document.addEventListener('visibilitychange', function(){
  if(document.hidden && state === 'playing') togglePause();
});
window.addEventListener('resize', function(){
  setupCanvas();
});

/* SECTION: boot */
resetWorld();
setupCanvas();
showOverlay('贪吃蛇', '控制小蛇吃掉食物，身体会越来越长。<br>别撞墙，也别咬到自己！', '开始游戏', '桌面端用方向键 / WASD，手机端滑动屏幕即可');
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
